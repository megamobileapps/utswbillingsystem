<div class="container px-2">
    <div class="row pt-1">


        <form [formGroup]="deliveryForm" (ngSubmit)="onSubmit()" class="bg-light p-2" name="deliveryForm" id="deliveryForm"
            action="">

            <div class="row g-2 mb-2">
                <div class="form-group col-6 position-relative">
                    <!-- <label for="cPayname" class="control-label">Name:*</label> -->

                    <input id="cPayname" name="cPayname" class="input form-control form-control-sm" type="text"
                        placeholder="Name" formControlName="cPayname"
                        [matAutocomplete]="autoCustomer"
                        autocomplete="off"
                        [(ngModel)]="currentCart!.username"
                        [ngClass]="{ 'is-invalid': submitted && f['cPayname'].errors }" required="">
                    <mat-autocomplete #autoCustomer="matAutocomplete" [displayWith]="displayCustomerFn" (optionSelected)="onCustomerSelected($event)">
                        <mat-option *ngFor="let customer of customerSuggestions$ | async" [value]="customer">
                            <div class="d-flex justify-content-between align-items-center w-100 py-1">
                                <span class="fw-semibold text-truncate text-capitalize me-2" style="max-width: 140px;">{{ customer.username }}</span>
                                <span class="badge bg-light text-dark border flex-shrink-0 font-monospace">{{ customer.phonenumber }}</span>
                            </div>
                        </mat-option>
                    </mat-autocomplete>
                    <div *ngIf="submitted && f['cPayname'].errors" class="invalid-feedback">
                        <div *ngIf="f['cPayname'].errors['required']">Name required</div>
                    </div>

                </div>

                <div class="form-group col-6">
                    <!-- <label for="cPayMobile" class="control-label">Ph.<span style="color:red;"></span>:*</label> -->

                    <input name="cPayMobile" formControlName="cPayMobile" id="cPayMobile" pattern="[1-9]{1}[0-9]{9}"
                    [(ngModel)]="currentCart!.phonenumber"
                        maxlength="10" class="input form-control form-control-sm" type="text"
                        title="Please enter exactly 10 digits"
                        [ngClass]="{ 'is-invalid': submitted && f['cPayMobile'].errors }" placeholder="Mobile"
                        value="" required="">

                </div>
            </div>

            <div class="row g-2 mb-2">
                <div class="form-group col-6">
                    <div class="input-group input-group-sm">
                        <input name="cDiscount" formControlName="cDiscount" id="cDiscount"
                        [(ngModel)]="discountPctInput" (input)="onPctInput(discountPctInput)"
                            [ngClass]="{ 'is-invalid': submitted && f['cDiscount'].errors }" class="form-control"
                            type="text" placeholder="Discount">
                        <span class="input-group-text bg-light text-muted fw-bold">%</span>
                    </div>
                </div>

                <div class="form-group col-6">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-light text-muted fw-bold">₹</span>
                        <input name="cDiscountVal" formControlName="cDiscountVal" id="cDiscountVal"
                        [(ngModel)]="discountValInput" (input)="onValInput(discountValInput)"
                            [ngClass]="{ 'is-invalid': submitted && f['cDiscountVal'].errors }" class="form-control"
                            type="text" placeholder="Discount">
                    </div>
                </div>
            </div>

            <div class="row mb-1">
                <div class="form-group col-12 d-flex flex-wrap gap-2 align-items-center">                   
                    <label class="d-flex align-items-center small m-0">
                        <input type="radio" value="Gpay" formControlName="payment_method">
                          <span class="ps-1">Gpay</span>
                    </label>
                    <label class="d-flex align-items-center small m-0">
                        <input type="radio" value="SBIQR" formControlName="payment_method">
                          <span class="ps-1">SBIQR</span>
                    </label>
                    <label class="d-flex align-items-center small m-0">
                        <input type="radio" value="Cash" formControlName="payment_method">
                          <span class="ps-1">Cash</span>
                    </label>
                    <label class="d-flex align-items-center small m-0">
                        <input type="radio" value="Phonepe" formControlName="payment_method">
                          <span class="ps-1">PhonePe</span>
                    </label>
                </div>

            </div>


        </form>

        <div class="row my-2 px-3">

            <button type="button" class="btn btn-primary col-12 btn-sm py-1 fw-bold" (click)="onSubmit()" value="Click to Pay">Click to
                Print

            </button>

        </div> 
    </div>
</div>
