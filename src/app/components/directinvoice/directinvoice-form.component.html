<div class="billing-viewport d-flex flex-column">
  
  <!-- 1. Top Toolbar (Fixed) -->
  <div class="toolbar-section bg-light py-2 px-3 shadow-sm d-flex justify-content-between align-items-center">
    <h2 class="m-0 text-primary fs-5"><mat-icon class="align-middle me-1">receipt_long</mat-icon> Billing</h2>
    <button mat-mini-fab color="primary" (click)="addItem()" title="Add New Item">
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <!-- 2. Scrollable Data Area (Flexible) -->
  <div class="table-scroll-area flex-grow-1 bg-white">
    <form [formGroup]="invoice">
      
      <!-- Sticky Header -->
      <div class="spreadsheet-header d-flex align-items-center border-bottom bg-light">
        <div class="col-index text-center fw-bold small text-muted">#</div>
        <div class="col-barcode fw-bold small text-muted ps-1">Barcode</div>
        <div class="col-name fw-bold small text-muted ps-1">Product Name</div>
        <div class="col-mrp fw-bold small text-muted text-end pe-1">MRP</div>
        <div class="col-disc fw-bold small text-muted text-center">D%</div>
        <div class="col-qty fw-bold small text-muted text-center">Qty</div>
        <div class="col-action text-center"></div>
      </div>

      <!-- Data Rows -->
      <div formArrayName="items" class="spreadsheet-body">
        <div *ngFor="let item of itemControls.controls; let i=index" [formGroupName]="i" 
             class="data-row d-flex flex-nowrap align-items-center border-bottom bg-white">
          
          <div class="col-index text-center small text-secondary">{{i+1}}</div>

          <div class="col-barcode p-1">
             <input type="text" class="form-control form-control-sm spreadsheet-input" 
                   formControlName="barcode" (change)="onBarcodeScanned($event, i)">
          </div>

        <!-- Product Name (Autocomplete) -->
        <div class="col-name p-1">
            <input type="text" class="form-control form-control-sm spreadsheet-input fw-bold" 
                   placeholder="Product Name" 
                   formControlName="productname" 
                   [matAutocomplete]="auto" 
                   required>
            <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn" (optionSelected)="onProductSelected($event, i)">
              <mat-option *ngFor="let option of filteredOptions[i] | async" [value]="option" class="small-option">
                <div class="d-flex justify-content-between">
                  <span>{{option.productname}}</span>
                  <span>₹{{option.mrp}}</span>
                </div>
              </mat-option>
            </mat-autocomplete>
        </div>

          <div class="col-mrp p-1">
            <input type="number" class="form-control form-control-sm spreadsheet-input text-end" formControlName="mrp">
          </div>

          <div class="col-disc p-1">
            <input type="number" class="form-control form-control-sm spreadsheet-input text-center" formControlName="discount">
          </div>

          <div class="col-qty p-1">
            <input type="number" class="form-control form-control-sm spreadsheet-input text-center fw-bold bg-light-blue" formControlName="quantity">
          </div>

          <div class="col-action p-1 text-center">
            <div class="d-flex gap-1 justify-content-center align-items-center w-100 h-100">
             <button class="btn btn-sm text-primary p-0 d-flex align-items-center justify-content-center" (click)="onPushSingleItemToCart(i)" tabindex="-1" title="Add to Cart">
               <mat-icon class="tiny-icon">add_shopping_cart</mat-icon>
             </button>
             <button class="btn btn-sm text-danger p-0 d-flex align-items-center justify-content-center" (click)="removeItem(i)" tabindex="-1" title="Remove">
               <mat-icon class="tiny-icon">close</mat-icon>
             </button>
            </div>
          </div>

        </div>
      </div>
    </form>
  </div>

  <!-- 3. Footer Actions (Fixed) -->
  <div class="footer-section bg-white border-top shadow-lg p-2 d-flex justify-content-between align-items-center">
    <div>
      <small class="text-muted d-block" style="font-size: 10px;">TOTAL</small>
      <h3 class="m-0 text-success fw-bold fs-5">{{currBasketAmt | currency:'INR'}}</h3>
    </div>
    <div class="d-flex gap-2">
      <button mat-stroked-button color="primary" (click)="onCalculateBillAmount()" class="btn-sm compact-mat-btn">
        <mat-icon>refresh</mat-icon>
      </button>
      <button mat-raised-button color="primary" (click)="onPushToCart()" [disabled]="loading" class="compact-mat-btn">
        PUSH TO CART
      </button>
    </div>
  </div>

</div>
