<div class="filter-controls-container">
  <mat-form-field>
    <mat-label>Date range</mat-label>
    <mat-date-range-input [formGroup]="range" [rangePicker]="picker">
      <input matStartDate formControlName="start" placeholder="Start date">
      <input matEndDate formControlName="end" placeholder="End date">
    </mat-date-range-input>
    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-date-range-picker #picker></mat-date-range-picker>
  </mat-form-field>
  
  <button mat-fab (click)="filter_clicked()"><mat-icon>search</mat-icon></button>

  <mat-form-field>
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="E.g. Product Name" #input>
  </mat-form-field>

  <mat-slide-toggle [formControl]="onlyAvailable" (change)="onToggleAvailable()">Only Available</mat-slide-toggle>
  
  <button mat-button [matMenuTriggerFor]="menu">Columns</button>
  <mat-menu #menu="matMenu">
    <button mat-menu-item (click)="toggleAllColumns()">
      <mat-checkbox [checked]="areAllColumnsSelected()">Select All</mat-checkbox>
    </button>
    <button mat-menu-item *ngFor="let column of optionalColumns" (click)="toggleColumn(column)">
      <mat-checkbox [checked]="_displayedColumns.includes(column)">{{column}}</mat-checkbox>
    </button>
  </mat-menu>

  <button mat-raised-button color="accent" (click)="onAddInventory()">
    <mat-icon>add</mat-icon> Add Inventory
  </button>

  <div class="upload-container">
    <label for="inventory-upload" class="mat-raised-button mat-primary">
      <mat-icon>upload_file</mat-icon> Upload Inventory
    </label>
    <input type="file" id="inventory-upload" (input)="onxlsxFileChange($event)" multiple="false" accept=".xlsx, .xls, .csv">
  </div>

  <button mat-raised-button color="primary" (click)="downloadInventory()" [disabled]="dataSource.data.length === 0">
    <mat-icon>download</mat-icon> Download Inventory
  </button>
</div>

<div class="mat-elevation-z8">
  <div class="table-container">
    <cdk-virtual-scroll-viewport itemSize="50" [class]="customHeightClass" [style.height]="viewportHeight" class="virtual-scroll-viewport" #virtualScrollViewport>
      <table mat-table [dataSource]="dataSource" matSort (matSortChange)="announceSortChange($event)">

        <ng-container *ngFor="let column of allColumns">
          <ng-container [matColumnDef]="column">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> {{column}} </th>
            <td mat-cell *matCellDef="let element"> {{element[column]}} </td>
          </ng-container>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let element" class="actions-cell">
            <button mat-icon-button (click)="onEditInventory(element)" matTooltip="Edit">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button (click)="onCopyInventory(element)" matTooltip="Copy and Add">
              <mat-icon>content_copy</mat-icon>
            </button>
            <button mat-icon-button (click)="openDialogForDeleteConfirmation($event, element)" matTooltip="Delete">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="currentDisplayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: currentDisplayedColumns;"></tr>
      </table>
    </cdk-virtual-scroll-viewport>
  </div>
</div>
