<div class="container-fluid h-100 d-flex flex-column">
    <!-- 1. Tabs (Fixed Height) -->
    <ul class="nav nav-tabs flex-shrink-0">
        <li class="nav-item">
            <a class="nav-link" [class.active]="selectedTab === 'scan'" (click)="selectTab('scan')">Scan</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" [class.active]="selectedTab === 'manual'" (click)="selectTab('manual')">Manual</a>
        </li>
        <li class="nav-item" *ngIf="isMobileScreen">
            <a class="nav-link" [class.active]="selectedTab === 'camera'" (click)="selectTab('camera')">Camera</a>
        </li>
    </ul>

    <!-- 2. Main Content Area (Fills remaining height) -->
    <div class="d-flex flex-column flex-md-row flex-grow-1 overflow-hidden" style="min-height: 0;">
        
        <!-- Left Panel: Scanner / Manual Invoice -->
        <div class="col-12 col-md-7 d-flex flex-column h-100">
            
            <!-- Scan Tab -->
            <div *ngIf="selectedTab === 'scan'" class="h-100 d-flex flex-column">
                <div class="accordion flex-grow-1 overflow-auto" id="accordionExample">
                    <div class="accordion-item">
                        <h2 class="accordion-header" id="headingOne">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                            Scanned Invoice
                        </button>
                        </h2>
                        <div id="collapseOne" class="accordion-collapse collapse show" aria-labelledby="headingOne" data-bs-parent="#accordionExample">
                        <div class="accordion-body">
                            <div class="card">
                                <div class="card-header">
                                    <form class="form-inline" >
                                        <div class="input-group">
                                            <input class="form-control" 
                                            (keyup)="applyFilter($event)"
                                                type="text" placeholder="Search" aria-label="Search" #filter>
                                            <span class="input-group-append">
                                                <button class="btn btn-outline-success" type="button" 
                                                (click)="applyFilter({target: filter})"><i class="bi bi-search"></i></button>
                                            </span>
                                        </div>
                                    </form>
                                    <div class="btn-toolbar" role="toolbar" aria-label="Toolbar with button groups">
                                        <div class="btn-group mr-2" role="group" aria-label="First group">
                                        <button *ngFor="let cat of categories, let i=index" 
                                        (click)="setCatSelection(cat.grade)"
                                        type="button" class="btn btn-secondary">{{cat.grade}}</button>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-body" *ngIf="!isMobileScreen">
                                    <div class="table-container">
                                        <cdk-virtual-scroll-viewport itemSize="50" [style.height]="viewportHeight" class="virtual-scroll-viewport" #virtualScrollViewport>
                                            <table mat-table [dataSource]="dataSource" matSort>
                                                <ng-container matColumnDef="productname">
                                                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Product Name </th>
                                                    <td mat-cell *matCellDef="let element"> {{element.productname}} </td>
                                                </ng-container>
                                                <ng-container matColumnDef="mrp">
                                                    <th mat-header-cell *matHeaderCellDef mat-sort-header> MRP </th>
                                                    <td mat-cell *matCellDef="let element"> {{element.mrp}} </td>
                                                </ng-container>
                                                <ng-container matColumnDef="qtyavailable">
                                                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Available </th>
                                                    <td mat-cell *matCellDef="let element"> {{element.qtyavailable}} </td>
                                                </ng-container>
                                                <ng-container matColumnDef="actions">
                                                    <th mat-header-cell *matHeaderCellDef> Actions </th>
                                                    <td mat-cell *matCellDef="let element">
                                                        <app-displayitem [ofItem]="element" [enableBuy]="true"></app-displayitem>
                                                    </td>
                                                </ng-container>
                                                <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                                                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                                            </table>
                                        </cdk-virtual-scroll-viewport>
                                    </div>
                                </div>
                                <div class="card-body" *ngIf="isMobileScreen">
                                    <div class="table-container">
                                        <cdk-virtual-scroll-viewport itemSize="50" [style.height]="viewportHeight" class="virtual-scroll-viewport" #virtualScrollViewport>
                                            <table mat-table [dataSource]="dataSource" matSort>
                                                
                                                <ng-container matColumnDef="actions">
                                                    <th mat-header-cell *matHeaderCellDef> Actions </th>
                                                    <td mat-cell *matCellDef="let element">
                                                        <app-displayitem [ofItem]="element" [enableBuy]="true"></app-displayitem>
                                                    </td>
                                                </ng-container>
                                                <tr mat-header-row *matHeaderRowDef="displayedColumns_mobile; sticky: true"></tr>
                                                <tr mat-row *matRowDef="let row; columns: displayedColumns_mobile;"></tr>
                                            </table>
                                        </cdk-virtual-scroll-viewport>
                                    </div>
                                </div>
                            </div>
                        </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Manual Tab (Direct Invoice) -->
            <div *ngIf="selectedTab === 'manual'" class="h-100">
                <app-directinvoice-form [oldinvoiceid]="oldinvoiceid" class="d-block h-100"></app-directinvoice-form>
            </div>

            <!-- Camera Tab -->
            <div *ngIf="selectedTab === 'camera'" class="h-100 d-flex flex-column align-items-center justify-content-center bg-dark">
                 <div class="scanner-container w-100 h-100 position-relative">
                    
                    <zxing-scanner *ngIf="isScanning"
                        [enable]="isScanning"
                        [formats]="allowedFormats"
                        (scanSuccess)="onCodeResult($event)"
                        (camerasFound)="onCamerasFound($event)"
                        (permissionResponse)="onHasPermission($event)"
                        class="w-100 h-100 d-block object-fit-cover">
                    </zxing-scanner>

                    <!-- Viewfinder Overlay -->
                    <div class="scanner-overlay d-flex align-items-center justify-content-center" *ngIf="isScanning">
                        <div class="scanner-region">
                            <div class="corner-tl"></div>
                            <div class="corner-tr"></div>
                            <div class="corner-bl"></div>
                            <div class="corner-br"></div>
                            <div class="scanner-laser"></div>
                        </div>
                        <p class="text-white small mt-3 fw-bold" style="text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Align Barcode/QR within the square</p>
                    </div>

                    <!-- Debug Overlay -->
                    <div style="position: absolute; top: 10px; left: 10px; z-index: 20; background: rgba(0,0,0,0.7); color: lime; padding: 5px; font-size: 10px; pointer-events: none; max-width: 80%;">
                        <div *ngFor="let log of scanLogs">{{log}}</div>
                    </div>

                    <!-- Manual Start/Stop (If permission issues or explicit user control needed) -->
                    <div class="position-absolute bottom-0 w-100 p-3 d-flex justify-content-center" style="z-index: 30; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);">
                        <button class="btn btn-light rounded-pill fw-bold" (click)="toggleCamera()">
                            {{ isScanning ? 'Stop Camera' : 'Start Camera' }}
                        </button>
                    </div>

                    <!-- Placeholder when stopped -->
                    <div *ngIf="!isScanning" class="position-absolute top-50 start-50 translate-middle text-white text-center">
                        <mat-icon style="font-size: 64px; width: 64px; height: 64px;">videocam_off</mat-icon>
                        <p class="mt-2">Camera Paused</p>
                    </div>

                </div>
            </div>
        </div>

        <!-- Right Panel: Cart (Desktop Only) -->
        <div class="col-12 col-md-5 d-flex flex-column h-100 panel-divider" *ngIf="!isMobileScreen">
            <div class="h-100">
                <app-cart></app-cart>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="col-12 flex-shrink-0">
        <div class="card border-top-0 rounded-0">
        <div class="card-body py-1">
            <p class="text text-center m-0 small text-muted">Sripank Software Solutions</p>
        </div>
        </div>
    </div>
</div>
