<div class="h-100 d-flex flex-column bg-white border-start">
    
    <!-- 1. Unified Header (Total Centered & Prominent) -->
    <div class="cart-header p-2 bg-light border-bottom shadow-sm" style="z-index: 5;">
        <div class="d-flex align-items-center justify-content-between w-100">
            <!-- Left: ID & Date -->
            <div class="d-flex flex-column" style="line-height: 1.1;">
                <span class="text-primary fw-bold small">#{{txId}}</span>
                <span class="text-muted" style="font-size: 0.65rem;">{{today | date:'dd/MM HH:mm'}}</span>
            </div>

            <!-- Center: Total (Prominent) -->
            <div class="text-center px-2">
                <span class="h5 m-0 text-success fw-bold">{{totalAmount - customerDiscount | currency:'INR':'symbol':'1.0-0'}}</span>
            </div>

            <!-- Right: Quantity -->
            <div class="text-end">
                <span class="text-secondary small">Qty: <span class="fw-bold text-dark">{{totalQuantity}}</span></span>
            </div>
        </div>
    </div>

    <!-- 4. Checkout Action (Footer) -->
    <div class="cart-footer p-0 border-top bg-light">
        <app-checkout class="d-block w-100"></app-checkout>
    </div>

    <!-- 3. Scrollable Cart Items -->
    <div class="cart-items flex-grow-1 overflow-auto p-0">
        <app-displaycart></app-displaycart>
    </div>

</div>
