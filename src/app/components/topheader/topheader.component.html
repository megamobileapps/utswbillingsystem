<nav class="app-header d-print-none">
  <!-- Brand / Home Link -->
  <a class="nav-brand" [routerLink]="['/catalogue']">
    <mat-icon>storefront</mat-icon> 
    <div class="brand-text">
      <span class="brand-name">UTSW Retail</span>
      
      <!-- Standard User Badge -->
      <span class="store-badge" *ngIf="currentStore && !isSuperUser">
        {{currentStore.name}} (ID: {{currentStore.id}})
      </span>
    </div>
  </a>

  <!-- Super User Switcher (Moved outside anchor to prevent navigation) -->
  <div class="store-switcher" *ngIf="isSuperUser && allStores.length > 0">
    <mat-form-field appearance="fill" class="store-select-field">
      <mat-select [value]="currentStore?.id" (selectionChange)="onStoreChange($event.value)" placeholder="Select Store">
        <mat-option *ngFor="let store of allStores" [value]="store.id">
          {{store.name}} ({{store.id}})
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <!-- Main Navigation Actions -->
  <div class="nav-actions">
    <button mat-button class="nav-btn" (click)="createNewCart()">
      <mat-icon>add_shopping_cart</mat-icon> New Cart
    </button>
    <button mat-button class="nav-btn" (click)="clearCart()">
      <mat-icon>remove_shopping_cart</mat-icon> Clear
    </button>
    <button mat-button class="nav-btn" (click)="holdCart()">
      <mat-icon>pause_circle_outline</mat-icon> Hold
    </button>
  </div>

  <!-- Right Side: Cart Summary & Profile -->
  <div class="nav-right">
    <a class="cart-link" [routerLink]="['/cart']">
      <mat-icon>shopping_cart</mat-icon>
      <span class="badge-count" *ngIf="totalQuantity > 0">{{totalQuantity}}</span>
    </a>

    <!-- Menu Dropdown -->
    <button mat-icon-button [matMenuTriggerFor]="menu" class="profile-btn">
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item [routerLink]="['/newcode']">
        <mat-icon>qr_code</mat-icon> Generate Barcode
      </button>
      <button mat-menu-item [routerLink]="['/showinventory']">
        <mat-icon>inventory_2</mat-icon> Inventory
      </button>
      <button mat-menu-item [routerLink]="['/addinventory']">
        <mat-icon>add_box</mat-icon> Add Inventory
      </button>
      <button mat-menu-item [routerLink]="['/directinvoice']">
        <mat-icon>receipt</mat-icon> Direct Invoice
      </button>
      <button mat-menu-item [routerLink]="['/bills']">
        <mat-icon>history</mat-icon> All Bills
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item [routerLink]="['/login']">Login</button>
      <button mat-menu-item [routerLink]="['/logout']">Logout</button>
    </mat-menu>
  </div>
</nav>

<!-- Sub-header for Old Bills (Keep functionality but style it better) -->
<div class="sub-header d-print-none" *ngIf="oldTxList.length > 0">
  <span class="text-muted small me-2">Old Bills:</span>
  <button mat-stroked-button class="mini-bill-btn" *ngFor="let cart of oldTxList" (click)="populateCartFrom(cart)">
    {{cart.invoicenumber}}
  </button>
</div>
